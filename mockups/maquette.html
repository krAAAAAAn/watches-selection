<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watch Selection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --stage:#f1f0ec;           /* fond « pierre » : les photos à fond blanc s'y fondent (multiply) */
  --paper:#f8f7f4;
  --ink:#121212;
  --soft:#86837c;
  --faint:#c9c6bf;
  --hair:rgba(18,18,18,.10);
  --gold:#a3865a;
  --night:#060708;
  --good:#5f8a6a; --warn:#b98b3c; --bad:#a65a46;
  --display:"Cormorant Garamond",Didot,"Bodoni 72",Georgia,serif;
  --ui:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.2,.7,.1,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--stage);color:var(--ink);font:300 15px/1.6 var(--ui);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
::selection{background:var(--ink);color:var(--stage)}

/* ---------- typographie ---------- */
.eyebrow{font:500 10.5px/1 var(--ui);letter-spacing:.32em;text-transform:uppercase;color:var(--soft)}
.eyebrow.gold{color:var(--gold)}
.display{font:300 clamp(40px,5.4vw,84px)/.95 var(--display);letter-spacing:-.01em;margin:0}
.display em{font-style:italic;color:var(--soft)}
.tagline{font:italic 300 clamp(18px,1.6vw,23px)/1.35 var(--display);color:var(--soft);margin:0}
.link{font:500 11px/1 var(--ui);letter-spacing:.24em;text-transform:uppercase;display:inline-flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--ink);transition:gap .4s var(--ease)}
.link:hover{gap:18px}
.btn{font:500 11px/1 var(--ui);letter-spacing:.24em;text-transform:uppercase;padding:16px 26px;background:var(--ink);color:var(--stage);display:inline-flex;gap:10px;align-items:center;transition:opacity .3s}
.btn:hover{opacity:.85}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

/* ---------- en-tête ---------- */
header{position:fixed;inset:0 0 auto 0;z-index:30;display:flex;align-items:center;gap:32px;padding:22px 40px;
  background:linear-gradient(var(--stage) 30%,transparent);pointer-events:none}
header>*{pointer-events:auto}
.mark{font:400 13px/1 var(--ui);letter-spacing:.5em;text-transform:uppercase;margin-right:auto;display:flex;align-items:center;gap:14px}
.mark i{width:22px;height:22px;border:1px solid var(--ink);border-radius:50%;position:relative;flex:none}
.mark i::before,.mark i::after{content:"";position:absolute;left:50%;bottom:50%;width:1px;background:var(--ink);transform-origin:bottom}
.mark i::before{height:7px;transform:rotate(-30deg)}.mark i::after{height:9px;transform:rotate(60deg)}
nav{display:flex;gap:30px}
nav a{font:500 10.5px/1 var(--ui);letter-spacing:.28em;text-transform:uppercase;color:var(--soft);padding:6px 0;border-bottom:1px solid transparent;transition:color .3s}
nav a:hover,nav a.on{color:var(--ink);border-color:var(--ink)}
.plus{width:38px;height:38px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center;font:200 22px/1 var(--ui);transition:background .3s,color .3s}
.plus:hover{background:var(--ink);color:var(--stage)}

/* ---------- image produit détourée ---------- */
.shot{position:relative;display:grid;place-items:center;isolation:isolate}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;transition:opacity .6s var(--ease),transform .9s var(--ease)}
.shot::after{content:"";position:absolute;left:24%;right:24%;bottom:1%;height:5%;background:radial-gradient(ellipse at center,rgba(0,0,0,.20),transparent 70%);filter:blur(6px);z-index:-1}
.shot.leaving img{opacity:0;transform:translateY(14px) scale(.97)}

/* ---------- COLLECTION : une famille = un écran ---------- */
.slide{position:relative;min-height:100vh;padding:110px 40px 34px 150px;display:grid;grid-template-rows:1fr auto;overflow:hidden;border-bottom:1px solid var(--hair)}
.ghost{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:300 clamp(120px,23vw,380px)/.8 var(--display);letter-spacing:-.02em;
  color:transparent;-webkit-text-stroke:1px rgba(18,18,18,.11);white-space:nowrap;pointer-events:none;user-select:none}
.slide-grid{position:relative;display:grid;grid-template-columns:minmax(240px,1fr) minmax(300px,1.25fr) minmax(220px,.8fr);align-items:center;gap:40px}
.slide .shot{height:min(64vh,640px)}
.slide .shot img,.d-stage .shot img{-webkit-mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent)}
.slide .left{display:flex;flex-direction:column;gap:22px;align-items:flex-start}
.count{font:300 13px/1 var(--ui);letter-spacing:.2em;color:var(--soft)}
.count b{font-weight:500;color:var(--ink)}
.specs{list-style:none;margin:0;padding:0;width:100%}
.specs li{display:flex;justify-content:space-between;gap:18px;padding:13px 0;border-bottom:1px solid var(--hair);font-size:13.5px}
.specs li span:first-child{font:500 10px/1.9 var(--ui);letter-spacing:.24em;text-transform:uppercase;color:var(--soft)}
.specs li span:last-child{text-align:right}
.price{font:300 30px/1 var(--display);margin:22px 0 6px}
.swatches{display:flex;gap:10px;margin-top:18px}
.sw{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 1px var(--hair),inset 0 1px 2px rgba(255,255,255,.35);cursor:pointer;transition:transform .3s}
.sw:hover,.sw.on{transform:scale(1.25);box-shadow:0 0 0 1px var(--stage),0 0 0 2px var(--ink)}
.state{display:flex;align-items:center;gap:12px;min-height:46px}
.badge{font:500 9.5px/1 var(--ui);letter-spacing:.24em;text-transform:uppercase;padding:7px 10px;border:1px solid var(--hair);white-space:nowrap}
.badge.main{border-color:var(--ink)}
.badge.future{color:var(--gold);border-color:var(--gold)}

/* Rangée d'alternatives façon configurateur */
.alts{position:relative;display:flex;align-items:flex-end;gap:6px;margin-top:20px;padding-top:18px;border-top:1px solid var(--hair);overflow-x:auto;scrollbar-width:none}
.alts::-webkit-scrollbar{display:none}
.alts .lbl{flex:0 0 auto;align-self:center;margin-right:22px}
.th{flex:0 0 auto;width:92px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 4px 10px;position:relative;opacity:.55;transition:opacity .3s}
.th:hover,.th.on{opacity:1}
.th .shot{height:84px;width:84px}
.th .shot::after{display:none}
.th small{font:400 9.5px/1.25 var(--ui);letter-spacing:.06em;text-align:center;color:var(--soft);max-width:92px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th.on::after{content:"";position:absolute;bottom:0;left:30%;right:30%;height:1px;background:var(--ink)}
.th .star{position:absolute;top:2px;right:8px;font-size:10px;color:var(--gold)}

/* Index latéral des familles */
.rail{position:fixed;left:40px;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:14px}
.rail a{display:flex;align-items:center;gap:12px;font:500 9.5px/1 var(--ui);letter-spacing:.26em;text-transform:uppercase;color:transparent;transition:color .3s}
.rail a::before{content:"";width:14px;height:1px;background:var(--faint);transition:width .4s var(--ease),background .3s}
.rail:hover a{color:var(--soft)}
.rail a.on{color:transparent}.rail:hover a.on{color:var(--ink)}.rail a.on::before{width:34px;background:var(--ink)}

/* Intro collection */
.intro{min-height:100vh;display:grid;place-items:center;text-align:center;padding:120px 40px 60px;position:relative}
.intro .display{font-size:clamp(54px,9vw,150px)}
.intro .row{display:flex;gap:min(4vw,46px);justify-content:center;align-items:flex-end;margin-top:60px;flex-wrap:wrap}
.intro .row a{display:flex;flex-direction:column;align-items:center;gap:14px;transition:transform .6s var(--ease)}
.intro .row a:hover{transform:translateY(-8px)}
.intro .row .shot{height:min(17vh,170px);width:min(11vw,120px)}
.intro .row .shot::after{bottom:-6%}
.scroll-hint{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px}
.scroll-hint i{width:1px;height:46px;background:linear-gradient(var(--ink),transparent);animation:drip 2.2s var(--ease) infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* ---------- CATALOGUE ---------- */
.page{padding:130px 40px 100px;max-width:1500px;margin:0 auto}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;flex-wrap:wrap;margin-bottom:46px}
.toolbar{display:flex;flex-wrap:wrap;gap:28px;align-items:center;justify-content:space-between;padding:18px 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);margin-bottom:50px}
.tabs{display:flex;gap:26px;flex-wrap:wrap}
.tab{font:500 10.5px/1 var(--ui);letter-spacing:.24em;text-transform:uppercase;color:var(--soft);padding:6px 0;border-bottom:1px solid transparent}
.tab:hover,.tab.on{color:var(--ink);border-color:var(--ink)}
.search{border:0;border-bottom:1px solid var(--hair);background:transparent;font:300 14px var(--ui);color:var(--ink);padding:8px 0;width:220px;outline:none}
.search:focus{border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:70px 34px}
.card{display:flex;flex-direction:column;gap:16px;cursor:pointer}
.card .shot{aspect-ratio:4/5;background:var(--paper)}
.card .shot img{inset:12% 14%;width:auto;height:auto}
.card .shot img{transition:transform 1s var(--ease)}
.card:hover .shot img{transform:scale(1.05)}
.card .shot::after{display:none}
.card .meta{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.card h3{font:400 23px/1.1 var(--display);margin:6px 0 4px}
.card p{margin:0;font-size:12.5px;color:var(--soft)}
.card .pr{font:300 19px/1 var(--display);white-space:nowrap;margin-top:22px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:500 9.5px/1 var(--ui);letter-spacing:.22em;text-transform:uppercase;color:var(--soft);text-align:left;padding:14px 10px;border-bottom:1px solid var(--ink);cursor:pointer;white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--hair);vertical-align:middle}
tbody tr{cursor:pointer;transition:background .2s}tbody tr:hover{background:var(--paper)}
td .shot{width:58px;height:58px}td .shot::after{display:none}
td b{font:400 18px/1.15 var(--display)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Indice poignet minimaliste */
.fit{display:inline-flex;align-items:center;gap:8px;font:500 9.5px/1 var(--ui);letter-spacing:.2em;text-transform:uppercase;white-space:nowrap}
.fit i{display:inline-flex;gap:3px}
.fit i b{width:10px;height:2px;background:var(--faint)}
.fit[data-s="5"] i b.on{background:var(--good)}.fit[data-s="4"] i b.on{background:var(--good);opacity:.7}
.fit[data-s="3"] i b.on{background:var(--warn)}.fit[data-s="2"] i b.on{background:var(--bad)}

/* ---------- FICHE ---------- */
.detail{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(340px,1fr);min-height:100vh}
.d-stage{position:sticky;top:0;height:100vh;padding:100px 40px 40px;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:20px;background:var(--stage);transition:background .8s var(--ease)}
.d-stage .shot{height:100%;min-height:0}
.d-stage .shot img{inset:0 6%;width:auto}

.d-stage.night{background:var(--night);color:#e9e6df}
.d-stage.night .shot img{mix-blend-mode:normal}
.d-stage.night .shot::after{display:none}
.d-stage.night .tab{color:#77746e}.d-stage.night .tab.on{color:#fff;border-color:#fff}
.vnav{display:flex;align-items:center;gap:18px}
.arrow{width:34px;height:34px;border:1px solid var(--hair);border-radius:50%;display:grid;place-items:center;font:300 15px/1 var(--ui);transition:border-color .3s}
.arrow:hover{border-color:var(--ink)}
.fav{font:500 9.5px/1 var(--ui);letter-spacing:.22em;text-transform:uppercase;color:var(--soft);border-bottom:1px solid transparent;padding:6px 0}
.fav:hover{color:var(--ink)}.fav.on{color:var(--gold);border-color:var(--gold)}
.d-stage .shot{touch-action:pan-y}
.nightmsg{font:italic 300 22px/1.4 var(--display);color:#8b8780;text-align:center;max-width:360px}
.d-ctrl{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.d-info{background:var(--paper);padding:130px 56px 80px;display:flex;flex-direction:column;gap:28px}
.d-info .display{font-size:clamp(40px,4vw,64px)}
.gauge{position:relative;height:1px;background:var(--hair);margin:34px 0 14px}
.gauge::before{content:"";position:absolute;left:18%;width:55%;top:-1px;height:3px;background:var(--good);opacity:.45}
.gauge b{position:absolute;top:-7px;width:1px;height:15px;background:var(--ink)}
.gauge b span{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font:500 10px/1 var(--ui);letter-spacing:.12em;white-space:nowrap}
.gscale{display:flex;justify-content:space-between;align-items:center;font:400 10px/1 var(--ui);letter-spacing:.12em;color:var(--soft)}
.section{padding:90px 40px;max-width:1180px;margin:0 auto}
.section+.section{border-top:1px solid var(--hair)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:70px}
.cols ul{list-style:none;padding:0;margin:20px 0 0}
.cols li{padding:14px 0;border-bottom:1px solid var(--hair);font:300 21px/1.35 var(--display)}
.quote{font:italic 300 clamp(26px,3vw,40px)/1.3 var(--display);text-align:center;max-width:920px;margin:26px auto 0}
.quote::before{content:"“";display:block;font-size:90px;line-height:.6;color:var(--gold);font-style:normal}
.notes{width:100%;min-height:150px;border:0;border-bottom:1px solid var(--hair);background:transparent;font:300 24px/1.5 var(--display);color:var(--ink);resize:vertical;outline:none;padding:16px 0;margin-top:18px}
.notes:focus{border-color:var(--ink)}
.saved{color:var(--good);opacity:0;transition:opacity .4s;margin-left:10px}.saved.show{opacity:1}
.ext{display:flex;gap:26px;flex-wrap:wrap}

/* ---------- AJOUT ---------- */
.add{min-height:100vh;padding:150px 40px 100px;max-width:1100px;margin:0 auto}
.big-in{display:flex;align-items:flex-end;gap:24px;border-bottom:1px solid var(--ink);margin:40px 0 20px}
.big-in input{flex:1;border:0;background:transparent;font:300 clamp(28px,4vw,56px)/1.2 var(--display);color:var(--ink);padding:10px 0;outline:none;min-width:0}
.big-in input::placeholder{color:var(--faint)}
.steps{list-style:none;padding:0;margin:60px 0;display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.steps li{font:400 10.5px/1.5 var(--ui);letter-spacing:.06em;color:var(--faint);padding-top:16px;position:relative}
.steps li::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:var(--hair)}
.steps li::after{content:"";position:absolute;top:0;left:0;height:1px;width:0;background:var(--ink);transition:width .6s linear}
.steps li.run,.steps li.done{color:var(--ink)}
.steps li.run::after{width:60%}.steps li.done::after{width:100%}
.proposal{display:grid;grid-template-columns:1fr 1.2fr;gap:60px;align-items:start;animation:rise .9s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
.proposal .shot{height:520px;background:var(--paper)}
.proposal .shot img{inset:8%;width:auto;height:auto}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:6px 30px}
.fields label{display:flex;flex-direction:column;gap:2px;padding:12px 0;border-bottom:1px solid var(--hair)}
.fields label span{font:500 9.5px/1.6 var(--ui);letter-spacing:.22em;text-transform:uppercase;color:var(--soft)}
.fields input{border:0;background:transparent;font:300 19px/1.3 var(--display);color:var(--ink);outline:none;padding:2px 0}
.fields .full{grid-column:1/-1}
.ai-note{font:italic 300 20px/1.45 var(--display);border-left:1px solid var(--gold);padding:4px 0 4px 22px;margin:0 0 26px}
.chips{display:flex;gap:16px;flex-wrap:wrap;padding-top:6px}
.chip{font:500 9.5px/1 var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--soft);padding:6px 0;border-bottom:1px solid transparent}
.chip.on{color:var(--ink);border-color:var(--ink)}

.demo{position:fixed;right:16px;bottom:14px;z-index:40;font:400 10px/1.4 var(--ui);letter-spacing:.08em;color:var(--soft);background:var(--paper);padding:8px 12px;box-shadow:0 0 0 1px var(--hair);max-width:300px}

/* ---------- mobile ---------- */
@media (max-width:980px){
  header{padding:16px;gap:18px}
  .mark{letter-spacing:.3em;font-size:11px}.mark span{display:none}
  nav{gap:18px}
  .rail{display:none!important}
  .slide{padding:90px 16px 24px}
  .slide-grid{grid-template-columns:1fr;gap:18px}
  .slide .shot{height:42vh;order:-1}
  .slide .left .tagline{display:none}
  .slide .left{gap:12px}
  .ghost{top:28%;font-size:38vw}
  .intro{padding:110px 16px 80px}
  .intro .row .shot{height:110px;width:70px}
  .page{padding:100px 16px 80px}
  .grid{grid-template-columns:repeat(2,1fr);gap:40px 14px}
  .card h3{font-size:18px}.card .pr{display:none}
  .detail{grid-template-columns:1fr}
  .d-stage{position:relative;height:auto;min-height:72vh;padding:90px 16px 24px}
  .d-stage .shot{height:56vh}
  .d-info{padding:40px 16px}
  .section{padding:60px 16px}
  .cols{grid-template-columns:1fr;gap:30px}
  .add{padding:110px 16px 60px}
  .steps{grid-template-columns:repeat(3,1fr)}
  .proposal{grid-template-columns:1fr;gap:30px}
  .proposal .shot{height:340px}
  .fields{grid-template-columns:1fr}
  .table-wrap{overflow-x:auto}
  .demo{display:none}
}
</style>
</head>
<body>
<header>
  <a class="mark" href="#/collection"><i></i><span>Watch Selection</span></a>
  <nav>
    <a href="#/collection" data-r="collection">Collection</a>
    <a href="#/catalogue" data-r="catalogue">Catalogue</a>
  </nav>
  <a class="plus" href="#/ajouter" title="Ajouter une montre">+</a>
</header>
<div class="rail" id="rail"></div>
<main id="app"></main>
<div class="demo">MAQUETTE · données de démonstration. Les photos se chargent depuis les sites des marques ; deux photos détourées sont incluses (Concordia, Tsuyosa).</div>

/* ============================================================
   Utilitaires
   ============================================================ */
const $ = s => document.querySelector(s);
const byId = id => W.find(w => w.id === id);
const catOf = id => CATS.find(c => c.id === id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mm = n => n == null ? "—" : String(n).replace(".", ",") + " mm";
const go = h => location.hash = h;

// Silhouette au trait affichée si la photo ne se charge pas
const FALLBACK = "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" fill="none" stroke="#b9b5ad" stroke-width="1.2">
<path d="M70 20h60l6 72H64z" fill="#e7e5e0"/><path d="M64 208h72l-6 72H70z" fill="#e7e5e0"/>
<circle cx="100" cy="150" r="62" fill="#f4f3f0"/><circle cx="100" cy="150" r="52"/><rect x="161" y="143" width="9" height="14" rx="2" fill="#f4f3f0"/>
${Array.from({length:12},(_,i)=>{const a=i*Math.PI/6,r1=i%3?46:42;return `<line x1="${(100+r1*Math.sin(a)).toFixed(1)}" y1="${(150-r1*Math.cos(a)).toFixed(1)}" x2="${(100+49*Math.sin(a)).toFixed(1)}" y2="${(150-49*Math.cos(a)).toFixed(1)}"/>`}).join("")}
<line x1="100" y1="150" x2="100" y2="112" stroke="#8a867f" stroke-width="2"/><line x1="100" y1="150" x2="126" y2="164" stroke="#8a867f" stroke-width="2.4"/><circle cx="100" cy="150" r="2.5" fill="#8a867f"/></svg>`);
const pic = (src, alt = "") => `<img src="${esc(src || FALLBACK)}" alt="${esc(alt)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='${FALLBACK}'">`;

// Indice poignet (cf. docs/CONCEPTION.md §5) : entre-cornes vs largeur du poignet (~51 mm pour 18 cm)
function fit(w){
  const l = w.l2l || w.d * 1.2, top = WRIST * 10 * 0.285;
  const label = {5:"Idéal", 4:"Bien", 3:"Limite", 2:"Grande"};
  let s = l < top - 9 ? 3 : l <= top - 1 ? 5 : l <= top + 1 ? 4 : l <= top + 3 ? 3 : 2;
  let txt = l < top - 9 ? "Petite" : label[s];
  if (w.t > 13 && s > 2) { s--; txt = label[s] + " · épaisse"; }
  return {s, txt, l};
}
const fitTag = w => { const f = fit(w); return `<span class="fit" data-s="${f.s}" title="Entre-cornes ${mm(+f.l.toFixed(1))} · poignet ${WRIST} cm"><i>${[1,2,3,4,5].map(i=>`<b class="${i<=f.s?"on":""}"></b>`).join("")}</i>${f.txt}</span>`; };
const mainImg = w => (w.variants && w.variants[w.fav || 0].img) || w.img;
const isPick = w => CATS.some(c => c.pick === w.id);
const statusOf = w => isPick(w) ? "main" : w.status;
const statusTxt = {main:"Choix principal", alternative:"Alternative", future:"Piste future"};
const badge = w => { const s = statusOf(w); return `<span class="badge ${s}">${statusTxt[s]}</span>`; };

const store = {
  get: k => { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};

/* ============================================================
   COLLECTION — introduction + une famille par écran
   ============================================================ */
const viewing = {}; // famille → montre affichée (peut différer du choix principal)
const scrollToFam = id => document.getElementById("fam-" + id).scrollIntoView({behavior:"smooth"});

function viewCollection(){
  const row = CATS.map(c => { const w = byId(c.pick); return `
    <a href="#fam-${c.id}" onclick="event.preventDefault();scrollToFam('${c.id}')">
      <div class="shot">${pic(mainImg(w), w.model)}</div><span class="eyebrow">${esc(c.label)}</span></a>`; }).join("");
  return `
  <section class="intro">
    <div>
      <div class="eyebrow gold">Collection personnelle · ${CATS.length} rôles</div>
      <h1 class="display" style="margin-top:22px">Une montre,<br><em>un rôle.</em></h1>
      <div class="row">${row}</div>
    </div>
    <div class="scroll-hint"><span class="eyebrow">Découvrir</span><i></i></div>
  </section>
  ${CATS.map((c, i) => `<section class="slide" id="fam-${c.id}">${slideInner(c, i)}</section>`).join("")}`;
}

function slideInner(c, i){
  const shown = byId(viewing[c.id] || c.pick);
  const members = [byId(c.pick), ...W.filter(w => w.cats.includes(c.id) && w.id !== c.pick)];
  const preview = shown.id !== c.pick;
  return `
  <div class="ghost">${esc(c.ghost)}</div>
  <div class="slide-grid">
    <div class="left">
      <div class="count"><b>${String(i + 1).padStart(2, "0")}</b> / ${String(CATS.length).padStart(2, "0")} &nbsp;—&nbsp; ${esc(c.label)}</div>
      <div>
        <div class="eyebrow" style="margin-bottom:14px">${esc(shown.brand)}</div>
        <h2 class="display">${esc(shown.model)}</h2>
      </div>
      <p class="tagline">${esc(shown.tagline)}</p>
      <div class="state">
        ${preview
          ? `<button class="btn" onclick="promote('${c.id}','${shown.id}')">★ En faire mon choix</button>`
          : `<span class="badge main">Choix principal</span>`}
        ${shown.status === "future" ? '<span class="badge future">Piste future</span>' : ""}
      </div>
      <a class="link" href="#/fiche/${shown.id}">Découvrir la fiche <span>→</span></a>
    </div>
    <div class="shot" id="shot-${c.id}">${pic(mainImg(shown), shown.model)}</div>
    <div>
      <ul class="specs">
        <li><span>Diamètre</span><span>${mm(shown.d)}</span></li>
        <li><span>Épaisseur</span><span>${mm(shown.t)}</span></li>
        <li><span>Entre-cornes</span><span>${mm(shown.l2l)}</span></li>
        <li><span>Mouvement</span><span>${esc(shown.mvt)}</span></li>
        <li><span>Étanchéité</span><span>${esc(shown.wr)}</span></li>
        <li><span>Poignet ${WRIST} cm</span><span>${fitTag(shown)}</span></li>
      </ul>
      <div class="price">${esc(shown.price)}</div>
      <div class="eyebrow">${esc(shown.avail)}</div>
      ${shown.variants ? `<div class="swatches">${shown.variants.map((v, k) => `<span class="sw ${k === (shown.fav || 0) ? "on" : ""}" style="background:${v.c}" title="${esc(v.n)}"></span>`).join("")}</div>` : ""}
    </div>
  </div>
  <div class="alts">
    <span class="lbl eyebrow">${members.length - 1} alternative${members.length > 2 ? "s" : ""}</span>
    ${members.map(w => `
      <button class="th ${w.id === shown.id ? "on" : ""}" onclick="preview('${c.id}','${w.id}')" title="${esc(w.brand + " " + w.model)}">
        ${w.id === c.pick ? '<span class="star">★</span>' : ""}
        <div class="shot">${pic(mainImg(w), w.model)}</div><small>${esc(w.model)}</small>
      </button>`).join("")}
  </div>`;
}

function rerenderSlide(catId){
  const i = CATS.findIndex(c => c.id === catId);
  document.getElementById("fam-" + catId).innerHTML = slideInner(CATS[i], i);
}
function preview(catId, watchId){
  document.getElementById("shot-" + catId).classList.add("leaving");
  setTimeout(() => { viewing[catId] = watchId; rerenderSlide(catId); }, 280);
}
function promote(catId, watchId){
  catOf(catId).pick = watchId;   // dans l'application : enregistré dans watches.json
  viewing[catId] = watchId;
  rerenderSlide(catId);
}

/* Index latéral : suit la famille visible */
let observer;
function setupRail(){
  const rail = $("#rail");
  rail.innerHTML = CATS.map(c => `<a href="#fam-${c.id}" data-c="${c.id}" onclick="event.preventDefault();scrollToFam('${c.id}')">${esc(c.label)}</a>`).join("");
  rail.style.display = "";
  observer?.disconnect();
  observer = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) rail.querySelectorAll("a").forEach(a => a.classList.toggle("on", "fam-" + a.dataset.c === e.target.id));
  }), {threshold:.55});
  document.querySelectorAll(".slide").forEach(s => observer.observe(s));
}

/* ============================================================
   CATALOGUE — galerie ou tableau
   ============================================================ */
const cat = {q:"", f:"", mode:"galerie", sort:"pmin", dir:1};
function viewCatalogue(){
  return `<div class="page">
    <div class="page-head">
      <div><div class="eyebrow gold">${W.length} montres</div><h1 class="display" style="margin-top:16px">Le catalogue</h1></div>
      <div class="tabs">
        <button class="tab ${cat.mode==="galerie"?"on":""}" onclick="cat.mode='galerie';render()">Galerie</button>
        <button class="tab ${cat.mode==="tableau"?"on":""}" onclick="cat.mode='tableau';render()">Tableau</button>
      </div>
    </div>
    <div class="toolbar">
      <div class="tabs">
        <button class="tab ${!cat.f?"on":""}" onclick="cat.f='';render()">Toutes</button>
        ${CATS.map(c => `<button class="tab ${cat.f===c.id?"on":""}" onclick="cat.f='${c.id}';render()">${esc(c.label)}</button>`).join("")}
      </div>
      <input class="search" placeholder="Rechercher…" value="${esc(cat.q)}" oninput="cat.q=this.value;fillCatalogue()">
    </div>
    <div id="cat"></div>
  </div>`;
}
function sortBy(k){ cat.dir = cat.sort === k ? -cat.dir : 1; cat.sort = k; fillCatalogue(); }
function fillCatalogue(){
  const q = cat.q.toLowerCase();
  const key = w => cat.sort === "fit" ? -fit(w).s : w[cat.sort];
  const list = W.filter(w => (!cat.f || w.cats.includes(cat.f)) && (!q || `${w.brand} ${w.model} ${w.mvt} ${w.cal||""}`.toLowerCase().includes(q)))
                .sort((a, b) => (key(a) > key(b) ? 1 : key(a) < key(b) ? -1 : 0) * cat.dir);
  $("#cat").innerHTML = cat.mode === "galerie"
    ? `<div class="grid">${list.map(w => `
        <article class="card" onclick="go('#/fiche/${w.id}')">
          <div class="shot">${pic(mainImg(w), w.model)}</div>
          <div class="meta">
            <div><div class="eyebrow">${esc(w.brand)}</div><h3>${esc(w.model)}</h3><p>${mm(w.d)} · ${esc(w.mvt)}</p></div>
            <div class="pr">${esc(w.price)}</div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">${fitTag(w)}${statusOf(w) !== "alternative" ? badge(w) : ""}</div>
        </article>`).join("")}</div>`
    : `<div class="table-wrap"><table><thead><tr>
        <th></th><th onclick="sortBy('brand')">Modèle</th><th>Famille</th><th>Statut</th>
        <th class="num" onclick="sortBy('d')">Ø</th><th class="num" onclick="sortBy('t')">Ép.</th><th class="num" onclick="sortBy('l2l')">E-C</th>
        <th onclick="sortBy('mvt')">Mouvement</th><th class="num" onclick="sortBy('pmin')">Prix</th><th onclick="sortBy('fit')">Poignet</th></tr></thead><tbody>
        ${list.map(w => `<tr onclick="go('#/fiche/${w.id}')">
          <td><div class="shot">${pic(mainImg(w), w.model)}</div></td>
          <td><div class="eyebrow">${esc(w.brand)}</div><b>${esc(w.model)}</b></td>
          <td>${w.cats.map(c => esc(catOf(c).label)).join(", ")}</td><td>${badge(w)}</td>
          <td class="num">${w.d}</td><td class="num">${w.t}</td><td class="num">${w.l2l ?? "—"}</td>
          <td>${esc(w.mvt)}</td><td class="num">${esc(w.price)}</td><td>${fitTag(w)}</td></tr>`).join("")}
       </tbody></table></div>`;
}

/* ============================================================
   FICHE
   ============================================================ */
function viewDetail(id){
  const w = byId(id); if (!w) return `<div class="page"><p>Montre introuvable.</p></div>`;
  const f = fit(w), pos = Math.min(97, Math.max(3, (f.l - 38) / (60 - 38) * 100));
  const row = (k, v) => v ? `<li><span>${k}</span><span>${esc(v)}</span></li>` : "";
  return `
  <div class="detail">
    <div class="d-stage" id="stage">
      <div class="shot" id="dshot">${pic(mainImg(w), w.model)}</div>
      <div class="d-ctrl">
        <div class="tabs">
          <button class="tab on" id="tday" onclick="dayNight('${w.id}',false)">Jour</button>
          <button class="tab" id="tnight" onclick="dayNight('${w.id}',true)">Nuit</button>
        </div>
        ${w.variants ? `<div class="vnav">
          <button class="arrow" onclick="stepVariant('${w.id}',-1)" title="Variante précédente">‹</button>
          <div class="swatches" style="margin:0">${w.variants.map((v, i) => `<span class="sw" style="background:${v.c}" title="${esc(v.n)}" onclick="variant('${w.id}',${i})"></span>`).join("")}</div>
          <button class="arrow" onclick="stepVariant('${w.id}',1)" title="Variante suivante">›</button>
          <span class="eyebrow" id="vname"></span>
          <button class="fav" id="fav" onclick="setFav('${w.id}')">♡ Ma couleur</button>
        </div>` : ""}
      </div>
    </div>
    <div class="d-info">
      <div class="eyebrow gold">${w.cats.map(c => esc(catOf(c).label)).join(" · ")}</div>
      <div><div class="eyebrow" style="margin-bottom:14px">${esc(w.brand)}</div><h1 class="display">${esc(w.model)}</h1></div>
      <p class="tagline">${esc(w.tagline)}</p>
      <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap"><span class="price" style="margin:0">${esc(w.price)}</span>${badge(w)}</div>
      <div>
        <div class="eyebrow">Au poignet · ${WRIST} cm</div>
        <div class="gauge"><b style="left:${pos}%"><span>${mm(+f.l.toFixed(1))}</span></b></div>
        <div class="gscale"><span>38</span><span>${fitTag(w)}</span><span>60 mm</span></div>
      </div>
      <ul class="specs">
        ${row("Diamètre", mm(w.d))}${row("Épaisseur", mm(w.t))}${row("Entre-cornes", w.l2l && mm(w.l2l))}
        ${row("Entre-anses", w.lug ? mm(w.lug) : "Bracelet intégré")}${row("Mouvement", w.mvt)}${row("Calibre", w.cal)}
        ${row("Verre", w.crystal)}${row("Boîtier", w.case)}${row("Étanchéité", w.wr)}${row("Poids", w.weight && w.weight + " g")}
        ${row("Luminescence", w.lume)}${row("Disponibilité", w.avail)}
      </ul>
      <div class="ext">${w.links.map(l => `<a class="link" href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.l)} <span>↗</span></a>`).join("")}</div>
    </div>
  </div>
  ${(w.pros.length || w.cons.length) ? `<section class="section"><div class="cols">
    <div><div class="eyebrow gold">Pourquoi elle séduit</div><ul>${w.pros.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>
    <div><div class="eyebrow">Ce qui peut freiner</div><ul>${w.cons.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>
  </div></section>` : ""}
  ${w.reviews ? `<section class="section" style="text-align:center"><div class="eyebrow">Ce qu'en disent pros & amateurs</div><p class="quote">${esc(w.reviews)}</p></section>` : ""}
  <section class="section">
    <div class="eyebrow gold">Mes notes <span class="saved" id="saved">— enregistré</span></div>
    <textarea class="notes" placeholder="Essayée chez… à surveiller en occasion… préférer le cadran vert…" oninput="saveNote('${w.id}',this.value)">${esc(store.get("note:" + w.id))}</textarea>
    <div style="display:flex;gap:30px;margin-top:40px;flex-wrap:wrap">
      <button class="link" onclick="alert('Maquette : modifier familles, statut et caractéristiques')">Modifier <span>✎</span></button>
      <button class="link" onclick="alert('Maquette : l\\'IA relit les sources et propose une mise à jour (prix, liens, avis)')">Actualiser avec l'IA <span>↻</span></button>
    </div>
  </section>`;
}
function dayNight(id, night){
  const w = byId(id), sh = $("#dshot");
  $("#stage").classList.toggle("night", night);
  $("#tday").classList.toggle("on", !night); $("#tnight").classList.toggle("on", night);
  sh.innerHTML = !night ? pic(w.variants ? w.variants[vIdx].img : w.img, w.model) : w.night ? pic(w.night, w.model)
    : `<p class="nightmsg">Aucune vue nocturne pour l'instant.<br>L'IA en cherchera une ; tu pourras aussi déposer ta propre photo.</p>`;
}
let vIdx = 0;
function variant(id, i){
  const w = byId(id), n = w.variants.length;
  vIdx = (i + n) % n;
  const v = w.variants[vIdx];
  document.querySelectorAll(".vnav .sw").forEach((s, k) => s.classList.toggle("on", k === vIdx));
  $("#vname").textContent = v.n;
  const isFav = vIdx === (w.fav || 0);
  $("#fav").classList.toggle("on", isFav); $("#fav").textContent = isFav ? "♥ Ma couleur" : "♡ Choisir cette couleur";
  const sh = $("#dshot"); sh.classList.add("leaving");
  setTimeout(() => { sh.innerHTML = pic(v.img, v.n); sh.classList.remove("leaving"); }, 220);
}
const stepVariant = (id, d) => variant(id, vIdx + d);
function setFav(id){ byId(id).fav = vIdx; variant(id, vIdx); }   // dans l'application : enregistré dans watches.json
function swipe(id){
  const el = $("#dshot"); let x0 = null;
  el.addEventListener("touchstart", e => x0 = e.touches[0].clientX, {passive:true});
  el.addEventListener("touchend", e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) stepVariant(id, dx < 0 ? 1 : -1); x0 = null; });
}

let noteTimer;
function saveNote(id, v){ clearTimeout(noteTimer); noteTimer = setTimeout(() => { store.set("note:" + id, v); const s = $("#saved"); s.classList.add("show"); setTimeout(() => s.classList.remove("show"), 1400); }, 500); }

/* ============================================================
   AJOUT — simulation du flux IA
   ============================================================ */
function viewAdd(){
  return `<div class="add">
    <div class="eyebrow gold">Nouvelle pièce</div>
    <h1 class="display" style="margin-top:18px">Qu'est-ce qui<br><em>t'a tapé dans l'œil ?</em></h1>
    <form class="big-in" onsubmit="event.preventDefault();runAI()">
      <input id="aiq" placeholder="Nom du modèle ou lien vers la fiche" value="Hamilton Khaki Field Mechanical 38">
      <button class="link" style="border:0">Chercher <span>→</span></button>
    </form>
    <p class="eyebrow">L'IA cherche la fiche officielle, les dimensions, les photos, les avis — puis te propose une fiche à valider.</p>
    <div id="aiout"></div>
  </div>`;
}
function runAI(){
  const steps = ["Recherche du modèle", "Fiche constructeur", "Dimensions & prix", "Photos jour, nuit, variantes", "Avis presse & forums", "Classement"];
  $("#aiout").innerHTML = `<ol class="steps">${steps.map(s => `<li>${s}</li>`).join("")}</ol><div id="prop"></div>`;
  const lis = [...document.querySelectorAll(".steps li")];
  lis.forEach((li, i) => {
    setTimeout(() => li.className = "run", i * 550);
    setTimeout(() => { li.className = "done"; if (i === lis.length - 1) proposal(); }, i * 550 + 500);
  });
}
function proposal(){
  $("#prop").innerHTML = `<div class="proposal">
    <div class="shot">${pic("", "")}</div>
    <div>
      <p class="ai-note">Je la classerais en <b>Field</b> : cadran militaire à grands chiffres, 38 mm, remontage manuel. Statut proposé : alternative — l'Erebus reste ton choix principal. Au poignet : idéale (entre-cornes 47 mm).</p>
      <div class="fields">
        <label><span>Marque</span><input value="Hamilton"></label>
        <label><span>Modèle</span><input value="Khaki Field Mechanical 38"></label>
        <label><span>Diamètre</span><input value="38 mm"></label>
        <label><span>Épaisseur</span><input value="9,5 mm"></label>
        <label><span>Entre-cornes</span><input value="47 mm"></label>
        <label><span>Entre-anses</span><input value="20 mm"></label>
        <label><span>Mouvement</span><input value="Manuel — H-50, 80 h"></label>
        <label><span>Prix indicatif</span><input value="≈ 545 €"></label>
        <label class="full"><span>Familles</span><div class="chips">${CATS.map(c => `<button type="button" class="chip ${c.id==="field"?"on":""}" onclick="this.classList.toggle('on')">${esc(c.label)}</button>`).join("")}</div></label>
        <label class="full"><span>Sources</span><input value="hamiltonwatch.com · Fratello · Hodinkee"></label>
      </div>
      <div style="display:flex;gap:16px;margin-top:34px;flex-wrap:wrap;align-items:center">
        <button class="btn" onclick="alert('Maquette : enregistrement dans watches.json, photos détourées et copiées dans img/');go('#/catalogue')">Ajouter à ma sélection</button>
        <button class="btn line" onclick="render()">Annuler</button>
      </div>
    </div></div>`;
}

/* ============================================================
   Routeur
   ============================================================ */
function render(){
  const [, route = "collection", arg] = location.hash.split("/");
  document.querySelectorAll("header nav a").forEach(a => a.classList.toggle("on", a.dataset.r === route || (route === "fiche" && a.dataset.r === "catalogue")));
  const views = {collection: viewCollection, catalogue: viewCatalogue, fiche: () => viewDetail(arg), ajouter: viewAdd};
  $("#app").innerHTML = (views[route] || viewCollection)();
  $("#rail").style.display = "none";
  if (route === "catalogue") fillCatalogue();
  if (route === "fiche" && byId(arg)?.variants) { const w = byId(arg); vIdx = w.fav || 0; variant(arg, vIdx); swipe(arg); }
  if (!views[route] || route === "collection") setupRail();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
