# Watch Selection — un conteneur PHP officiel, rien d'autre.
# À placer derrière Pangolin (qui gère l'accès).
services:
  watch-selection:
    image: php:8.3-apache
    container_name: watch-selection
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html          # application + données (app/data) + photos (app/img)
      - ./docker/php.ini:/usr/local/etc/php/conf.d/watch-selection.ini:ro
    # Crée les dossiers d'écriture et donne les droits à Apache, puis démarre
    command: bash -c "mkdir -p data img && chown -R www-data:www-data data img && exec apache2-foreground"
